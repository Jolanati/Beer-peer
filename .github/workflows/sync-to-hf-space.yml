name: Sync deployment → HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - "wine-dine/deployment/**"
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false          # weights are NOT in git — upload manually to HF

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Upload deployment/ to HF Space (preserving weights)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          sha = os.environ.get("GITHUB_SHA", "unknown")[:8]

          # upload_folder is an upsert — existing HF files NOT in the upload
          # (e.g. weights/) are left untouched.
          api.upload_folder(
              folder_path="wine-dine/deployment",
              repo_id="Jolanati/wine-dine",
              repo_type="space",
              ignore_patterns=["weights/**"],
              commit_message=f"Sync from GitHub {sha}",
          )
          print(f"Synced wine-dine/deployment → HF Space (sha={sha})")
          PYEOF
